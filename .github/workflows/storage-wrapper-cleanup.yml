name: Storage wrapper cleanup

on:
  pull_request:
    paths:
      - scripts/storage/remove-legacy-storage-wrappers.mjs
      - .github/workflows/storage-wrapper-cleanup.yml

permissions:
  contents: write

jobs:
  remove-storage-wrappers:
    name: Remove obsolete storage wrappers
    if: >-
      github.head_ref == 'fix/14-crash-safe-storage' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: fix/14-crash-safe-storage
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove obsolete wrappers
        run: node scripts/storage/remove-legacy-storage-wrappers.mjs

      - name: Format Rust source
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/core/storage.rs
          if git diff --cached --quiet; then
            echo "No wrapper cleanup was produced"
            exit 1
          fi
          git commit -m "refactor(storage): enforce the single service-owned persistence path"
          git push origin HEAD:fix/14-crash-safe-storage
