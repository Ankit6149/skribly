name: Foreground Target Correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/foreground-target-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture the target before showing Skribli
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/desktop/src-tauri/src/lib.rs")
          source = path.read_text(encoding="utf-8")
          old = '''                        if hotkey_id == GLOBAL_HOTKEY_ID {
                            if let Some(window) = app_handle_hk.get_webview_window("main") {
                                let _ = window.show();
                                let _ = window.set_focus();
                            }

                            let active_target = coordinator_hk.get_active_target();
                            let target_to_use = match active_target {
                                Some(t) => Some(t),
                                None => {
                                    #[cfg(target_os = "windows")]
                                    {
                                        get_foreground_target_window()
                                    }
                                    #[cfg(not(target_os = "windows"))]
                                    {
                                        None
                                    }
                                }
                            };
'''
          new = '''                        if hotkey_id == GLOBAL_HOTKEY_ID {
                            let target_to_use = {
                                #[cfg(target_os = "windows")]
                                {
                                    get_foreground_target_window()
                                        .or_else(|| coordinator_hk.get_active_target())
                                }
                                #[cfg(not(target_os = "windows"))]
                                {
                                    coordinator_hk.get_active_target()
                                }
                            };

                            if let Some(window) = app_handle_hk.get_webview_window("main") {
                                let _ = window.show();
                                let _ = window.set_focus();
                            }
'''
          if old not in source:
              raise SystemExit("Expected hotkey block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/foreground-target-correction.yml

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs .github/workflows/foreground-target-correction.yml
          git commit -m "fix: capture foreground app before opening a note"
          git push origin HEAD:main
