name: Storage acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/storage-acceptance.yml'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/src/bin/storage_acceptance.rs'
      - 'apps/desktop/src-tauri/src/core/license.rs'
      - 'apps/desktop/src-tauri/src/core/models.rs'
      - 'apps/desktop/src-tauri/src/core/storage.rs'
      - 'apps/desktop/src/stores/skribStore.ts'
      - 'apps/desktop/src/stores/storageFailureMessages.test.ts'
      - 'scripts/validation/storage-acceptance.ps1'
      - 'docs/02-engineering/ADR-0001-hardened-json-storage.md'
      - 'docs/04-operations/LOCAL_STORAGE_RECOVERY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-acceptance.yml'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/src/bin/storage_acceptance.rs'
      - 'apps/desktop/src-tauri/src/core/license.rs'
      - 'apps/desktop/src-tauri/src/core/models.rs'
      - 'apps/desktop/src-tauri/src/core/storage.rs'
      - 'apps/desktop/src/stores/skribStore.ts'
      - 'apps/desktop/src/stores/storageFailureMessages.test.ts'
      - 'scripts/validation/storage-acceptance.ps1'
      - 'docs/02-engineering/ADR-0001-hardened-json-storage.md'
      - 'docs/04-operations/LOCAL_STORAGE_RECOVERY.md'

permissions:
  contents: read

jobs:
  windows-storage-acceptance:
    name: Windows release-mode storage acceptance
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SKRIBLY_TRIAL_ENFORCED: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build storage acceptance binary in release mode
        run: cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml --bin storage_acceptance

      - name: Run Windows crash, lock, permission, corruption, and recovery matrix
        shell: pwsh
        run: |
          ./scripts/validation/storage-acceptance.ps1 `
            -BinaryPath './apps/desktop/src-tauri/target/release/storage_acceptance.exe' `
            -EvidencePath './artifacts/storage-acceptance/storage-acceptance-evidence.json' `
            -CommitSha '${{ github.sha }}'

      - name: Upload storage acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-acceptance-${{ github.sha }}
          path: artifacts/storage-acceptance
          if-no-files-found: error
          retention-days: 30
