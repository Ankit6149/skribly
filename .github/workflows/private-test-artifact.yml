name: Private Windows Test Artifact

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch or commit SHA to build for private Founder Alpha testing
        required: true
        type: string
      acknowledgement:
        description: Type BUILD_PRIVATE_TEST_ARTIFACT to confirm this is not a public release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-private-test-artifact:
    name: Build private Windows candidate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SKRIBLY_TRIAL_ENFORCED: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Confirm private-only build intent
        shell: pwsh
        run: |
          if ('${{ inputs.acknowledgement }}' -ne 'BUILD_PRIVATE_TEST_ARTIFACT') {
            throw 'Private artifact acknowledgement was not provided.'
          }
          if ('${{ inputs.candidate_ref }}' -match '^refs/tags/' -or '${{ inputs.candidate_ref }}' -match '^v\d') {
            throw 'Tags are not accepted by the private test-artifact workflow.'
          }

      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Validate private-artifact safety boundary
        run: node scripts/validation/validate-private-test-artifact-workflow.mjs

      - name: Validate application contracts
        run: |
          npm run governance:validate
          npm run product-truth:validate
          npm run site:validate
          npm run typecheck
          npm run test
          npm run build

      - name: Validate native application contracts
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1

      - name: Build Windows installers
        run: npm run tauri -- build --bundles nsis,msi

      - name: Create private-test manifest and checksums
        shell: pwsh
        run: |
          $artifactRoot = 'artifacts/private-test'
          $bundleRoot = 'apps/desktop/src-tauri/target/release/bundle'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $installers = Get-ChildItem -Path $bundleRoot -Recurse -File -Include *.exe,*.msi
          if ($installers.Count -eq 0) { throw 'Tauri did not produce an NSIS or MSI installer.' }
          $manifest = [ordered]@{
            schema_version = 1
            private_test_only = $true
            repository = '${{ github.repository }}'
            commit_sha = '${{ github.sha }}'
            candidate_ref = '${{ inputs.candidate_ref }}'
            version = (Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
            product_name = (Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).productName
            created_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            retention_days = 14
            supported_test_scope = @('private founder testing only', 'not signed', 'not a public release')
            installers = @($installers | ForEach-Object {
              [ordered]@{
                file_name = $_.Name
                relative_path = $_.FullName.Substring((Resolve-Path '.').Path.Length + 1).Replace('\\', '/')
                bytes = $_.Length
                sha256 = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              }
            })
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 "$artifactRoot/manifest.json"

      - name: Upload private Founder Alpha artifact
        uses: actions/upload-artifact@v7
        with:
          name: skribli-private-test-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            artifacts/private-test/manifest.json
          if-no-files-found: error
          retention-days: 14
