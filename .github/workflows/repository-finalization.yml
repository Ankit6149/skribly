name: Repository Finalization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-finalization.yml
      - apps/desktop/src-tauri/tauri.conf.json

permissions:
  contents: write

concurrency:
  group: repository-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove extra branches
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r branch; do
            if [ -n "$branch" ] && [ "$branch" != "main" ]; then
              git push origin --delete "$branch" || true
            fi
          done < <(git ls-remote --heads origin | awk '{ sub("refs/heads/", "", $2); print $2 }')
