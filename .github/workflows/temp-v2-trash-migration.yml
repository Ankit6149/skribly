          new_decode = '''        if schema_version == u64::from(PREVIOUS_SCHEMA_VERSION) {
            let stored: StoredSkribsV2Legacy =
                serde_json::from_value(value).map_err(|error| StorageError::InvalidData {
                    path: file_name_for_display(path),
                    reason: format!("invalid schema-v2 envelope: {error}"),
                })?;
            let expected =
                calculate_integrity_v2(stored.revision, stored.written_at_ms, &stored.skribs)?;
            if stored.integrity != expected {
                return Err(StorageError::InvalidData {
                    path: file_name_for_display(path),
                    reason: "schema-v2 integrity digest mismatch".to_string(),
                });
            }

            return Ok(DecodedCandidate {
