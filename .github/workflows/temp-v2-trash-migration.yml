fn temporary_directory(name: &str) -> PathBuf {
    std::env::temp_dir().join(format!(
        "skribli-trash-storage-{name}-{}-{}",
        std::process::id(),
        now_millis()
    ))
}

#[test]
fn authentic_schema_v2_integrity_migrates_without_lifecycle_loss() {
    let directory = temporary_directory("schema-v2");
    fs::create_dir_all(&directory).expect("create fixture directory");
    let primary = directory.join("skribs.json");
    let legacy_notes = vec![legacy_note("legacy")];
    let revision = 7;
    let written_at_ms = 1_234;
    let envelope = StoredSkribsV2Legacy {
        schema_version: PREVIOUS_SCHEMA_VERSION,
        revision,
        written_at_ms,
        integrity: calculate_integrity_v2(revision, written_at_ms, &legacy_notes)
            .expect("calculate authentic schema-v2 integrity"),
        skribs: legacy_notes,
    };
    fs::write(
        &primary,
        serde_json::to_vec_pretty(&envelope).expect("serialize schema-v2 fixture"),
    )
    .expect("write schema-v2 fixture");

    let mut storage = StorageService::new(primary.clone());
    let loaded = storage.load().expect("schema-v2 data should migrate");
    assert_eq!(loaded.revision, revision);
    assert_eq!(loaded.skribs.len(), 1);
    assert_eq!(loaded.skribs[0].id, "legacy");
    assert_eq!(loaded.skribs[0].deleted_at, None);
    assert_eq!(
        loaded.notice.as_ref().and_then(|notice| notice.migrated_from_schema),
        Some(PREVIOUS_SCHEMA_VERSION)
    );

    let restored: Value = serde_json::from_slice(&fs::read(&primary).expect("read migrated primary"))
        .expect("decode migrated primary");
    assert_eq!(
        restored.get("schema_version").and_then(Value::as_u64),
        Some(u64::from(CURRENT_SCHEMA_VERSION))
    );
    assert_eq!(
        restored["skribs"][0].get("deleted_at"),
        Some(&Value::Null)
    );

    let _ = fs::remove_dir_all(directory);
}

#[test]
fn schema_v3_round_trip_preserves_trashed_notes_without_purging() {
    let directory = temporary_directory("round-trip");
    let primary = directory.join("skribs.json");
    let trashed = note("trashed", Some(1));
    let mut storage = StorageService::new(primary.clone());
    storage.save(std::slice::from_ref(&trashed)).expect("save trashed note");

    let mut reopened = StorageService::new(primary);
    let loaded = reopened.load().expect("reload schema-v3 data");
    assert_eq!(loaded.skribs, vec![trashed]);

    let _ = fs::remove_dir_all(directory);
}

#[test]
fn backup_recovery_preserves_trash_lifecycle_metadata() {
    let directory = temporary_directory("recovery");
    let primary = directory.join("skribs.json");
    let trashed = note("recover-me", Some(300));
    let mut storage = StorageService::new(primary.clone());
    storage.save(std::slice::from_ref(&trashed)).expect("save first generation");
    storage.save(std::slice::from_ref(&trashed)).expect("rotate trashed backup");
    fs::write(&primary, b"{broken").expect("damage primary");

    let mut recovering = StorageService::new(primary);
    let loaded = recovering.load().expect("recover from verified backup");
    assert_eq!(loaded.skribs, vec![trashed]);
    assert!(loaded.notice.is_some());

    let _ = fs::remove_dir_all(directory);
}
''', encoding='utf-8')

      - name: Remove one-run workflow, format, and commit
        shell: bash
        run: |
