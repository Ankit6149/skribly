}

fn calculate_integrity_v2(
    revision: u64,
    written_at_ms: u64,
    skribs: &[SkribNoteV2],
) -> Result<String, StorageError> {
    let bytes = serde_json::to_vec(&IntegrityPayloadV2 {
        schema_version: PREVIOUS_SCHEMA_VERSION,
        revision,
        written_at_ms,
        skribs,
