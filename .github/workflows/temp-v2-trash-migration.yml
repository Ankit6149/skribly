        let expected = calculate_integrity(stored.revision, stored.written_at_ms, &stored.skribs)?;
        if stored.integrity != expected {
            return Err(StorageError::InvalidData {
                path: file_name_for_display(path),
                reason: "schema-v3 integrity digest mismatch".to_string(),
            });
        }

        return Ok(DecodedCandidate {
            source,
            path: path.to_path_buf(),
            revision: stored.revision,
            written_at_ms: stored.written_at_ms,
            skribs: stored.skribs,
            migrated_from_schema: None,
        });'''
          if text.count(old_decode) != 1:
              raise SystemExit(f'expected one schema decode block, found {text.count(old_decode)}')
          text = text.replace(old_decode, new_decode)

          marker = '#[cfg(test)]\nmod tests {'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one storage test module marker, found {text.count(marker)}')
          text = text.replace(marker, '#[cfg(test)]\nmod trash_storage_tests;\n\n' + marker)
          path.write_text(text, encoding='utf-8')

          tests = Path('apps/desktop/src-tauri/src/core/storage/trash_storage_tests.rs')
          tests.parent.mkdir(parents=True, exist_ok=True)
          tests.write_text(r'''use super::*;

fn note(id: &str, deleted_at: Option<u64>) -> SkribNote {
    SkribNote {
        id: id.into(),
        target_process_name: "notepad.exe".into(),
        target_title: "Project.txt - Notepad".into(),
        rel_x: 10.0,
        rel_y: 12.0,
        width: 400.0,
        height: 340.0,
        text: format!("Text for {id}"),
        color: "yellow".into(),
        collapsed: false,
        created_at: 100,
        updated_at: deleted_at.unwrap_or(200),
        deleted_at,
    }
}

fn legacy_note(id: &str) -> SkribNoteV2 {
    SkribNoteV2 {
        id: id.into(),
        target_process_name: "notepad.exe".into(),
        target_title: "Legacy.txt - Notepad".into(),
        rel_x: 10.0,
        rel_y: 12.0,
        width: 400.0,
