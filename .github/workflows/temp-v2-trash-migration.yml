name: Apply exact schema-v2 trash migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: schema-v2-trash-migration
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'Ankit6149/skribly' && github.head_ref == 'feat/131-reversible-trash' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/131-reversible-trash
          fetch-depth: 0

      - name: Preserve the exact schema-v2 integrity shape
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/src/core/storage.rs')
          text = path.read_text(encoding='utf-8')

          old_definitions = '''#[derive(Debug, Clone, Serialize, Deserialize)]
struct StoredSkribsV2 {
    schema_version: u32,
    revision: u64,
    written_at_ms: u64,
    integrity: String,
    skribs: Vec<SkribNote>,
}

#[derive(Serialize)]
struct IntegrityPayload<'a> {
    schema_version: u32,
    revision: u64,
    written_at_ms: u64,
    skribs: &'a [SkribNote],
}'''
          new_definitions = '''#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
struct SkribNoteV2 {
    id: String,
    target_process_name: String,
    target_title: String,
    rel_x: f64,
    rel_y: f64,
    width: f64,
    height: f64,
    text: String,
    color: String,
    collapsed: bool,
    created_at: u64,
    updated_at: u64,
}

impl From<SkribNoteV2> for SkribNote {
    fn from(note: SkribNoteV2) -> Self {
        Self {
            id: note.id,
            target_process_name: note.target_process_name,
            target_title: note.target_title,
            rel_x: note.rel_x,
            rel_y: note.rel_y,
            width: note.width,
            height: note.height,
            text: note.text,
            color: note.color,
            collapsed: note.collapsed,
            created_at: note.created_at,
            updated_at: note.updated_at,
            deleted_at: None,
        }
    }
}

#[derive(Debug, Clone, Serialize, Deserialize)]
struct StoredSkribsV2Legacy {
    schema_version: u32,
    revision: u64,
    written_at_ms: u64,
    integrity: String,
    skribs: Vec<SkribNoteV2>,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
struct StoredSkribsV2 {
    schema_version: u32,
    revision: u64,
    written_at_ms: u64,
    integrity: String,
    skribs: Vec<SkribNote>,
}

#[derive(Serialize)]
struct IntegrityPayloadV2<'a> {
    schema_version: u32,
    revision: u64,
    written_at_ms: u64,
    skribs: &'a [SkribNoteV2],
}

#[derive(Serialize)]
struct IntegrityPayload<'a> {
    schema_version: u32,
    revision: u64,
    written_at_ms: u64,
    skribs: &'a [SkribNote],
}'''
          if text.count(old_definitions) != 1:
              raise SystemExit(f'expected one storage definition block, found {text.count(old_definitions)}')
          text = text.replace(old_definitions, new_definitions)

          old_integrity = '''fn calculate_integrity(
    revision: u64,
    written_at_ms: u64,
    skribs: &[SkribNote],
) -> Result<String, StorageError> {
    calculate_integrity_for_schema(CURRENT_SCHEMA_VERSION, revision, written_at_ms, skribs)
}

fn calculate_integrity_for_schema(
    schema_version: u32,
    revision: u64,
    written_at_ms: u64,
    skribs: &[SkribNote],
) -> Result<String, StorageError> {
    let bytes = serde_json::to_vec(&IntegrityPayload {
        schema_version,
        revision,
        written_at_ms,
        skribs,
    })
    .map_err(|error| StorageError::InvalidData {
        path: "in-memory storage envelope".to_string(),
        reason: format!("failed to calculate integrity data: {error}"),
    })?;
    Ok(format!("crc32:{:08x}", crc32(&bytes)))
}'''
          new_integrity = '''fn calculate_integrity(
    revision: u64,
    written_at_ms: u64,
    skribs: &[SkribNote],
) -> Result<String, StorageError> {
    let bytes = serde_json::to_vec(&IntegrityPayload {
        schema_version: CURRENT_SCHEMA_VERSION,
        revision,
        written_at_ms,
        skribs,
    })
    .map_err(|error| StorageError::InvalidData {
        path: "in-memory storage envelope".to_string(),
        reason: format!("failed to calculate schema-v3 integrity data: {error}"),
    })?;
