name: Storage format preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/src-tauri/src/core/storage.rs
      - .github/workflows/storage-format-preview.yml

permissions:
  contents: read

jobs:
  format-preview:
    name: Generate rustfmt preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Upload formatted storage source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-storage-source
          path: apps/desktop/src-tauri/src/core/storage.rs
          if-no-files-found: error
          retention-days: 1
