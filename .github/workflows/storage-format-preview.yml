name: Storage format preview

on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/src/core/storage.rs
      - .github/workflows/storage-format-preview.yml

permissions:
  contents: write

jobs:
  format-storage:
    name: Apply rustfmt to storage branch
    if: >-
      github.head_ref == 'fix/14-crash-safe-storage' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: fix/14-crash-safe-storage
          fetch-depth: 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit formatter output only when required
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/src/core/storage.rs; then
            echo "storage.rs is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/core/storage.rs
          git commit -m "style(storage): apply rustfmt"
          git push origin HEAD:fix/14-crash-safe-storage
