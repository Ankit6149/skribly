name: Clean merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branch refs
    if: github.repository == 'Ankit6149/skribly'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete only verified stale branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          readonly default_branch='main'

          # These branch heads were individually audited against their merged PRs.
          # Squash merges do not make the old branch head an ancestor of main, so
          # ancestry alone cannot identify them as redundant.
          readonly -a audited_delete=(
            'chore/cleanup-merged-branches'
            'chore/cleanup-squash-merged-branches'
            'docs/expanded-product-roadmap'
            'feat/110-first-note-onboarding'
            'feat/126-all-skribs-window'
            'fix/14-crash-safe-storage'
            'fix/19-monitor-work-area-placement'
            'fix/20-canonical-note-lifecycle'
            'fix/33-repository-governance'
            'fix/86-node-runtime-contract'
            'fix/86-package-lock-runtime-metadata'
            'fix/89-vercel-node-runtime'
            'fix/91-92-ordered-note-saving'
            'fix/97-safe-delete-confirmation'
            'fix/99-product-truth-readme'
            'fix/101-rust-note-validation'
            'fix/105-single-instance-routing'
            'fix/107-bounded-winevent-pipeline'
            'fix/109-fail-closed-target-capture'
            'fix/111-vercel-ignored-builds'
            'fix/114-public-site-product-truth'
            'temp/onboarding-handoff'
            'test/33-unrelated-branch-survival'
          )

          is_audited_for_deletion() {
            local candidate="$1"
            local stale
            for stale in "${audited_delete[@]}"; do
              if [[ "$candidate" == "$stale" ]]; then
                return 0
              fi
            done
            return 1
          }

          delete_remote_branch() {
            local candidate="$1"
            git push origin ":refs/heads/$candidate"
          }

          mapfile -t remote_branches < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
              | sort -u
          )

          deleted=0
          preserved=0

          for branch in "${remote_branches[@]}"; do
            [[ -z "$branch" || "$branch" == 'HEAD' ]] && continue

            if [[ "$branch" == "$default_branch" || "$branch" == release/* || "$branch" == hotfix/* ]]; then
              echo "Preserving protected branch: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            if is_audited_for_deletion "$branch"; then
              echo "Deleting audited merged or disposable branch: $branch"
              delete_remote_branch "$branch"
              deleted=$((deleted + 1))
              continue
            fi

            if git merge-base --is-ancestor "origin/$branch" "origin/$default_branch"; then
              echo "Deleting branch fully merged into $default_branch: $branch"
              delete_remote_branch "$branch"
              deleted=$((deleted + 1))
            else
              echo "Preserving unmerged branch: $branch"
              preserved=$((preserved + 1))
            fi
          done

          echo "Deleted branches: $deleted"
          echo "Preserved branches: $preserved"
