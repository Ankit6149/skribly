name: Clean merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branch refs
    if: github.repository == 'Ankit6149/skribly'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect branches used by open pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | [.head.ref, .base.ref] | .[]' \
            | sort -u > "$RUNNER_TEMP/open-pr-refs.txt"

      - name: Delete only merged, unchanged, unreferenced heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          readonly default_branch='main'
          readonly protected_refs="$RUNNER_TEMP/open-pr-refs.txt"
          deleted=0
          preserved=0

          while IFS=$'\t' read -r branch expected_sha; do
            [[ -z "$branch" || "$branch" == 'HEAD' ]] && continue

            if [[ "$branch" == "$default_branch" || "$branch" == release/* || "$branch" == hotfix/* ]]; then
              echo "Preserving protected branch: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            if grep -Fqx -- "$branch" "$protected_refs"; then
              echo "Preserving branch used by an open pull request: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            if ! git merge-base --is-ancestor "$expected_sha" "origin/$default_branch"; then
              echo "Preserving branch with commits not merged into $default_branch: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | [.head.ref, .base.ref] | .[]' \
              | sort -u > "$RUNNER_TEMP/open-pr-current.txt"; then
              echo "Could not verify open pull-request references; stopping cleanup before deletion."
              exit 1
            fi

            if grep -Fqx -- "$branch" "$RUNNER_TEMP/open-pr-current.txt"; then
              echo "Preserving branch now used by an open pull request: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            if git push --force-with-lease="refs/heads/$branch:$expected_sha" origin ":refs/heads/$branch"; then
              echo "Deleted unchanged merged branch: $branch ($expected_sha)"
              deleted=$((deleted + 1))
            else
              echo "Preserving branch whose head changed after inspection: $branch"
              preserved=$((preserved + 1))
            fi
          done < <(
            git for-each-ref \
              --format='%(refname:strip=3)%09%(objectname)' \
              refs/remotes/origin \
              | sort -u
          )

          echo "Deleted branches: $deleted"
          echo "Preserved branches: $preserved"
