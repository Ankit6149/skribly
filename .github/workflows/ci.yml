name: CI

on:
  pull_request:

jobs:
  landing-site:
    name: Landing site validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static site files and links
        run: node site/validate.mjs

  frontend:
    name: Cross-platform frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build production bundles
        run: npm run build

  cargo-fmt:
    name: Rust formatting check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  windows-rust:
    name: Windows native Rust validation
    runs-on: windows-latest
    env:
      SKRIBLY_TRIAL_ENFORCED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Run Windows cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run Windows cargo tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1

      - name: Check restricted configuration compiles
        env:
          SKRIBLY_TRIAL_ENFORCED: "1"
          SKRIBLY_LICENSE_PUBLIC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-installer:
    name: Build Windows 0.1.2 installer candidate
    runs-on: windows-latest
    needs: [landing-site, frontend, cargo-fmt, windows-rust]
    env:
      SKRIBLY_TRIAL_ENFORCED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate platform icons from the approved logo
        run: npm --workspace @skribly/desktop run tauri -- icon ../../assets/branding/skribly-app-icon.svg

      - name: Build NSIS and MSI installers
        run: npm --workspace @skribly/desktop run tauri -- build --ci

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-candidate | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe installer-candidate/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi installer-candidate/
          Get-ChildItem installer-candidate -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Set-Content installer-candidate/SHA256SUMS.txt

      - name: Upload Windows installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: skribli-windows-0.1.2-candidate
          if-no-files-found: error
          retention-days: 3
          path: installer-candidate/*
