name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-target-binding:
    name: Apply target binding correction
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-note-flow-012
          fetch-depth: 0

      - name: Apply source change
        run: python tools/fix_bind_target.py

      - name: Commit source change
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/stores/skribStore.ts
          git commit -m "fix: preserve active target binding"
          git push origin HEAD:fix/windows-note-flow-012
