name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-native-source:
    name: Format native source
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: fix/foreground-note-target
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs
          git commit -m "style: format native interaction code"
          git push origin HEAD:fix/foreground-note-target
