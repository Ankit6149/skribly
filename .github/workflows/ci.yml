name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-governance:
    name: Repository governance and product truth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'

      - name: Validate repository governance controls
        run: node scripts/governance/validate-repository.mjs

      - name: Validate current product claims
        run: node scripts/validation/validate-product-truth.mjs

      - name: Validate Vercel ignored build policy
        run: node --test scripts/validation/vercel-ignore.test.mjs

      - name: Validate private test-artifact boundary
        run: node scripts/validation/validate-private-test-artifact-workflow.mjs

  landing-site:
    name: Landing site validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'

      - name: Validate static site files and links
        run: node site/validate.mjs

  frontend:
    name: Cross-platform frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build production bundles
        run: npm run build

  cargo-fmt:
    name: Rust formatting check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  windows-rust:
    name: Windows native Rust validation
    runs-on: windows-latest
    env:
      SKRIBLY_TRIAL_ENFORCED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Run Windows cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run Windows cargo tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1

      - name: Check restricted configuration compiles
        env:
          SKRIBLY_TRIAL_ENFORCED: "1"
          SKRIBLY_LICENSE_PUBLIC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
