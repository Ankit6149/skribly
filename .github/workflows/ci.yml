name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-note-flow:
    name: Apply Windows note flow correction
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-note-flow-012
          fetch-depth: 0

      - name: Apply source changes
        run: python tools/apply_windows_note_flow_fix.py

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/tauri.conf.json apps/desktop/src/features/overlay/OverlayHost.tsx apps/desktop/src/stores/skribStore.ts apps/desktop/src/stores/skribStore.test.ts
          git commit -m "fix: finalize Windows note flow"
          git push origin HEAD:fix/windows-note-flow-012
