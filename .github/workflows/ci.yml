name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  landing-site:
    name: Landing site validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static site files and links
        run: node site/validate.mjs

  frontend:
    name: Cross-platform frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build production bundles
        run: npm run build

  cargo-fmt:
    name: Rust formatting check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  windows-rust:
    name: Windows native Rust validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Run cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-bundle:
    name: Build Windows Founder Alpha installers
    runs-on: windows-latest
    needs: [landing-site, frontend, cargo-fmt, windows-rust]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate platform icons from the approved logo
        run: npm --workspace @skribly/desktop run tauri -- icon ../../assets/branding/skribly-app-icon.svg

      - name: Build NSIS and MSI installers
        run: npm --workspace @skribly/desktop run tauri -- build --ci

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: skribly-founder-alpha-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
