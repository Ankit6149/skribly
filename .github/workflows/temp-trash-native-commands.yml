name: Apply trash native commands

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: trash-native-commands
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'Ankit6149/skribly' && github.head_ref == 'feat/131-reversible-trash' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/131-reversible-trash
          fetch-depth: 0

      - name: Repair constructor and apply lifecycle commands
        shell: python
        run: |
          from pathlib import Path

          library_path = Path('apps/desktop/src-tauri/src/desktop/library.rs')
          library = library_path.read_text(encoding='utf-8')
          bad_header = '''    fn note(id: &str, created_at: u64, updated_at: u64) -> SkribNote {\n    deleted_at: None,\n        SkribNote {'''
          good_header = '''    fn note(id: &str, created_at: u64, updated_at: u64) -> SkribNote {\n        SkribNote {'''
          if library.count(bad_header) != 1:
              raise SystemExit(f'expected one malformed library constructor, found {library.count(bad_header)}')
          library = library.replace(bad_header, good_header)
          constructor_tail = '''            created_at,\n            updated_at,\n        }'''
          corrected_tail = '''            created_at,\n            updated_at,\n            deleted_at: None,\n        }'''
          if library.count(constructor_tail) != 1:
              raise SystemExit(f'expected one library constructor tail, found {library.count(constructor_tail)}')
          library_path.write_text(library.replace(constructor_tail, corrected_tail), encoding='utf-8')

          lib_path = Path('apps/desktop/src-tauri/src/lib.rs')
          text = lib_path.read_text(encoding='utf-8')
          old = '''#[tauri::command]\nfn delete_skrib_note(\n    app_handle: AppHandle,\n    state: State<'_, AppState>,\n    id: String,\n) -> Result<OverlayStatePayload, String> {\n    run_persisted_mutation(&state, |coordinator| {\n        coordinator\n            .remove_skrib(&id)\n            .map(|_| ())\n            .ok_or_else(|| "Skrib note was not found or is not writable".to_string())\n    })?;\n    Ok(build_mutation_payload(&app_handle, &state, false))\n}\n\n#[tauri::command]\nfn get_all_skribs(state: State<'_, AppState>) -> Vec<SkribNote> {\n    let mut skribs = state.coordinator.get_all_skribs();\n    skribs.sort_by(|a, b| b.updated_at.cmp(&a.updated_at));\n    skribs\n}'''
          new = '''fn lifecycle_timestamp_seconds() -> u64 {\n    std::time::SystemTime::now()\n        .duration_since(std::time::UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_secs()\n        .max(1)\n}\n\n#[tauri::command]\nfn trash_skrib_note(app_handle: AppHandle, state: State<'_, AppState>, id: String) -> Result<OverlayStatePayload, String> {\n    let deleted_at = lifecycle_timestamp_seconds();\n    run_persisted_mutation(&state, |coordinator| coordinator.trash_skrib(&id, deleted_at).map(|_| ()).ok_or_else(|| "Only an active writable note can be moved to Trash".to_string()))?;\n    Ok(build_mutation_payload(&app_handle, &state, false))\n}\n\n#[tauri::command]\nfn discard_empty_skrib_note(app_handle: AppHandle, state: State<'_, AppState>, id: String) -> Result<OverlayStatePayload, String> {\n    run_persisted_mutation(&state, |coordinator| coordinator.discard_empty_skrib(&id).map(|_| ()).ok_or_else(|| "Only an active empty note can be discarded".to_string()))?;\n    Ok(build_mutation_payload(&app_handle, &state, false))\n}\n\n#[tauri::command]\nfn restore_skrib_note(app_handle: AppHandle, state: State<'_, AppState>, id: String) -> Result<OverlayStatePayload, String> {\n    let restored_at = lifecycle_timestamp_seconds();\n    run_persisted_mutation(&state, |coordinator| coordinator.restore_skrib(&id, restored_at).map(|_| ()).ok_or_else(|| "Only a trashed writable note can be restored".to_string()))?;\n    Ok(build_mutation_payload(&app_handle, &state, false))\n}\n\n#[tauri::command]\nfn permanently_delete_skrib_note(app_handle: AppHandle, state: State<'_, AppState>, id: String) -> Result<OverlayStatePayload, String> {\n    run_persisted_mutation(&state, |coordinator| coordinator.permanently_delete_skrib(&id).map(|_| ()).ok_or_else(|| "Only a trashed writable note can be permanently deleted".to_string()))?;\n    Ok(build_mutation_payload(&app_handle, &state, false))\n}\n\n#[tauri::command]\nfn get_all_skribs(state: State<'_, AppState>) -> Vec<SkribNote> {\n    let mut skribs = state.coordinator.get_all_skribs();\n    skribs.sort_by(|left, right| right.updated_at.cmp(&left.updated_at).then_with(|| right.created_at.cmp(&left.created_at)).then_with(|| left.id.cmp(&right.id)));\n    skribs\n}'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy delete command block, found {text.count(old)}')
          text = text.replace(old, new)
          old_handler = '''            toggle_skrib_collapse,\n            delete_skrib_note,\n            get_all_skribs,'''
          new_handler = '''            toggle_skrib_collapse,\n            trash_skrib_note,\n            discard_empty_skrib_note,\n            restore_skrib_note,\n            permanently_delete_skrib_note,\n            get_all_skribs,'''
          if text.count(old_handler) != 1:
              raise SystemExit(f'expected one legacy handler marker, found {text.count(old_handler)}')
          text = text.replace(old_handler, new_handler)
          if 'fn delete_skrib_note(' in text or '.remove_skrib(&id)' in text:
              raise SystemExit('retired standalone delete command remains')
          lib_path.write_text(text, encoding='utf-8')

      - name: Remove one-run workflow, format, and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-trash-native-commands.yml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src
          git diff --cached --check
          git commit -m 'feat(trash): expose durable lifecycle commands'
          git push origin HEAD:feat/131-reversible-trash
