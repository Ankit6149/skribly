name: Compact Note Source Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-native-source:
    if: github.head_ref == 'fix/compact-note-window'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: fix/compact-note-window
          fetch-depth: 0

      - name: Complete compact window behaviour
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/desktop/src-tauri/src/lib.rs')
          source = path.read_text(encoding='utf-8')

          if 'position_compact_note_window(&window, target);' not in source:
              source, count = re.subn(
                  r'if let Some\(window\) = app_handle_hk\.get_webview_window\("main"\) \{\s*let _ = window\.show\(\);\s*let _ = window\.set_focus\(\);\s*\}',
                  '''if let Some(window) = app_handle_hk.get_webview_window("main") {
                                      #[cfg(target_os = "windows")]
                                      position_compact_note_window(&window, target);
                                      let _ = window.show();
                                      let _ = window.set_focus();
                                  }''',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not insert compact note placement')

          if 'let note_window_visible = app_handle_ev' not in source:
              source, count = re.subn(
                  r'if let Ok\(notice\) = event_receiver\.recv_timeout\(Duration::from_millis\(500\)\) \{\s*#\[cfg\(target_os = "windows"\)\]\s*\{',
                  '''if let Ok(notice) = event_receiver.recv_timeout(Duration::from_millis(500)) {
                          let note_window_visible = app_handle_ev
                              .get_webview_window("main")
                              .and_then(|window| window.is_visible().ok())
                              .unwrap_or(false);
                          if note_window_visible {
                              continue;
                          }

                          #[cfg(target_os = "windows")]
                          {''',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not insert foreground tracking guard')

          path.write_text(source, encoding='utf-8')

      - name: Format Rust source
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run formatter
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit source correction
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs
          git commit -m "fix compact note placement"
          git push origin HEAD:fix/compact-note-window
