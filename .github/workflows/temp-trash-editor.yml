name: Apply trash editor lifecycle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Ankit6149/skribly' && github.head_ref == 'feat/131-reversible-trash' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/131-reversible-trash
          fetch-depth: 0

      - name: Wire store and compact editor
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one pattern, found {count}')
              return text.replace(old, new)

          store_path = Path('apps/desktop/src/stores/skribStore.ts')
          store = store_path.read_text(encoding='utf-8')
          store = replace_once(
              store,
              '  deleteSkrib: (id: string) => Promise<boolean>;\n',
              '  trashSkrib: (id: string) => Promise<boolean>;\n  discardEmptySkrib: (id: string) => Promise<boolean>;\n',
              'store interface',
          )
          store = replace_once(
              store,
              '      created_at: now,\n      updated_at: now,\n',
              '      created_at: now,\n      updated_at: now,\n      deleted_at: null,\n',
              'new note lifecycle field',
          )
          old_delete = '''  deleteSkrib: async (id) => {\n    const blocked = writeBlockMessage();\n    if (blocked) {\n      set({ errorMessage: blocked });\n      return false;\n    }\n\n    const previousSkribs = get().skribs;\n    set({ skribs: previousSkribs.filter((n) => n.id !== id) });\n\n    if (!get().isTauriAvailable) return true;\n    try {\n      const payload = await invoke<OverlayStatePayload>('delete_skrib_note', { id });\n      set({\n        skribs: payload.skribs,\n        overlayMetrics: payload.overlay_metrics || get().overlayMetrics,\n        initStatus: payload.init_status || get().initStatus,\n        errorMessage: null,\n        storageErrorMessage: null,\n      });\n      return true;\n    } catch (e) {\n      const msg = e instanceof Error ? e.message : String(e);\n      set({\n        skribs: previousSkribs,\n        errorMessage: `Failed to delete Skrib: ${msg}`,\n        storageErrorMessage: `Failed to delete Skrib: ${msg}`,\n      });\n      await get().refreshStorageHealth();\n      return false;\n    }\n  },'''
          new_delete = '''  trashSkrib: async (id) => {\n    const blocked = writeBlockMessage();\n    if (blocked) {\n      set({ errorMessage: blocked });\n      return false;\n    }\n\n    const previousSkribs = get().skribs;\n    set({ skribs: previousSkribs.filter((note) => note.id !== id) });\n\n    if (!get().isTauriAvailable) return true;\n    try {\n      const payload = await invoke<OverlayStatePayload>('trash_skrib_note', { id });\n      set({\n        skribs: payload.skribs,\n        overlayMetrics: payload.overlay_metrics || get().overlayMetrics,\n        initStatus: payload.init_status || get().initStatus,\n        errorMessage: null,\n        storageErrorMessage: null,\n      });\n      return true;\n    } catch (error) {\n      const message = error instanceof Error ? error.message : String(error);\n      set({\n        skribs: previousSkribs,\n        errorMessage: `Failed to move Skrib to Trash: ${message}`,\n        storageErrorMessage: `Failed to move Skrib to Trash: ${message}`,\n      });\n      await get().refreshStorageHealth();\n      return false;\n    }\n  },\n\n  discardEmptySkrib: async (id) => {\n    const blocked = writeBlockMessage();\n    if (blocked) {\n      set({ errorMessage: blocked });\n      return false;\n    }\n\n    const previousSkribs = get().skribs;\n    set({ skribs: previousSkribs.filter((note) => note.id !== id) });\n\n    if (!get().isTauriAvailable) return true;\n    try {\n      const payload = await invoke<OverlayStatePayload>('discard_empty_skrib_note', { id });\n      set({\n        skribs: payload.skribs,\n        overlayMetrics: payload.overlay_metrics || get().overlayMetrics,\n        initStatus: payload.init_status || get().initStatus,\n        errorMessage: null,\n        storageErrorMessage: null,\n      });\n      return true;\n    } catch (error) {\n      const message = error instanceof Error ? error.message : String(error);\n      set({\n        skribs: previousSkribs,\n        errorMessage: `Failed to discard the empty Skrib: ${message}`,\n        storageErrorMessage: `Failed to discard the empty Skrib: ${message}`,\n      });\n      await get().refreshStorageHealth();\n      return false;\n    }\n  },'''
          store = replace_once(store, old_delete, new_delete, 'store delete implementation')
          if "'delete_skrib_note'" in store or 'deleteSkrib:' in store:
              raise SystemExit('retired store deletion path remains')
          store_path.write_text(store, encoding='utf-8')

          composer_path = Path('apps/desktop/src/features/skribs/SkribComposer.tsx')
          composer = composer_path.read_text(encoding='utf-8')
          replacements = [
              ('    deleteSkrib,\n', '    trashSkrib,\n    discardEmptySkrib,\n', 'composer store actions'),
              ('        const deleted = await deleteSkrib(note.id);\n        if (deleted) {', '        const discarded = await discardEmptySkrib(note.id);\n        if (discarded) {', 'empty discard call'),
              ('    deleteSkrib,\n    hideWindow,', '    discardEmptySkrib,\n    hideWindow,', 'empty discard dependency'),
              ('      const deleted = await deleteSkrib(note.id);\n      if (deleted) {', '      const movedToTrash = await trashSkrib(note.id);\n      if (movedToTrash) {', 'trash call'),
              ("        const message = 'The note could not be deleted safely. It remains available.';", "        const message = 'The note could not be moved to Trash safely. It remains available.';", 'trash failure copy'),
              ('                <strong>Delete this note permanently?</strong>\n                <small id="composer-delete-warning">\n                  Trash is not available in this build. This action cannot be undone.\n                </small>', '                <strong>Move this note to Trash?</strong>\n                <small id="composer-delete-warning">\n                  You can restore it from All Skribs for 30 days. Nothing is deleted permanently here.\n                </small>', 'trash confirmation copy'),
              ("                  {isFinishing ? 'Deleting…' : 'Delete permanently'}", "                  {isFinishing ? 'Moving…' : 'Move to Trash'}", 'trash confirmation action'),
          ]
          for old, new, label in replacements:
              composer = replace_once(composer, old, new, label)
          if 'deleteSkrib' in composer or 'Trash is not available' in composer or 'Delete permanently' in composer:
              raise SystemExit('retired permanent-delete composer copy remains')
          composer_path.write_text(composer, encoding='utf-8')

      - name: Remove one-run workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-trash-editor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src
          git diff --cached --check
          git commit -m 'feat(trash): move compact-editor deletion into Trash'
          git push origin HEAD:feat/131-reversible-trash
