name: Storage parent path fix

on:
  pull_request:
    paths:
      - scripts/storage/apply-issue-14-parent-path-fix.mjs
      - .github/workflows/storage-parent-path-fix.yml

permissions:
  contents: write

jobs:
  apply-parent-path-fix:
    name: Apply checked parent path fix
    if: >-
      github.head_ref == 'fix/14-crash-safe-storage' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: fix/14-crash-safe-storage
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply checked parent-path transformation
        run: node scripts/storage/apply-issue-14-parent-path-fix.mjs

      - name: Format Rust source
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit borrow-safe parent paths
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/core/storage.rs
          if git diff --cached --quiet; then
            echo "No parent-path changes were produced"
            exit 1
          fi
          git commit -m "fix(storage): own parent path across mutable recovery operations"
          git push origin HEAD:fix/14-crash-safe-storage
