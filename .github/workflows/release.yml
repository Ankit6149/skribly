name: Windows Release — Production Hold

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Type ENABLE_AFTER_NATIVE_VALIDATION to confirm the production hold was reviewed
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-hold:
    name: Installer publishing is disabled
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production hold
        shell: bash
        run: |
          if [ "${{ inputs.acknowledgement }}" != "ENABLE_AFTER_NATIVE_VALIDATION" ]; then
            echo "Skribli installer publishing is paused."
            echo "The previous beta was withdrawn while the native Windows experience is rebuilt."
            exit 1
          fi

          echo "Acknowledgement received, but this workflow intentionally does not build or publish installers."
          echo "Restore a reviewed release workflow only after native runtime validation passes."
