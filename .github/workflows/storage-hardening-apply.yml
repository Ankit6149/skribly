name: Storage hardening apply

on:
  pull_request:
    paths:
      - scripts/storage/apply-issue-14-hardening.mjs
      - .github/workflows/storage-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply-storage-hardening:
    name: Apply checked storage hardening
    if: >-
      github.head_ref == 'fix/14-crash-safe-storage' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: fix/14-crash-safe-storage
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply checked hardening transform
        run: node scripts/storage/apply-issue-14-hardening.mjs

      - name: Format Rust source
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src-tauri/src/core/storage.rs \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src/stores/skribStore.ts \
            apps/desktop/src/stores/skribStore.test.ts \
            apps/desktop/src/features/skribs/SkribComposer.tsx
          if git diff --cached --quiet; then
            echo "No hardening changes were produced"
            exit 1
          fi
          git commit -m "fix(storage): preserve corruption state and serialize mutations"
          git push origin HEAD:fix/14-crash-safe-storage
