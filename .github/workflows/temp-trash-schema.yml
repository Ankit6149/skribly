name: Apply trash schema migration

on:
  push:
    branches:
      - feat/131-reversible-trash

permissions:
  contents: write

concurrency:
  group: trash-schema-migration
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'Ankit6149/skribly' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/131-reversible-trash
          fetch-depth: 0

      - name: Apply asserted source transformation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one source pattern, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'apps/desktop/src-tauri/src/core/models.rs',
              '    pub created_at: u64,\n    pub updated_at: u64,\n}',
              '    pub created_at: u64,\n    pub updated_at: u64,\n    #[serde(default)]\n    pub deleted_at: Option<u64>,\n}',
          )

          storage_path = Path('apps/desktop/src-tauri/src/core/storage.rs')
          storage = storage_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'const CURRENT_SCHEMA_VERSION: u32 = 2;\nconst LEGACY_SCHEMA_VERSION: u32 = 1;',
                  'const CURRENT_SCHEMA_VERSION: u32 = 3;\nconst PREVIOUS_SCHEMA_VERSION: u32 = 2;\nconst LEGACY_SCHEMA_VERSION: u32 = 1;',
              ),
              (
                  '''fn calculate_integrity(\n    revision: u64,\n    written_at_ms: u64,\n    skribs: &[SkribNote],\n) -> Result<String, StorageError> {\n    let bytes = serde_json::to_vec(&IntegrityPayload {\n        schema_version: CURRENT_SCHEMA_VERSION,\n        revision,\n        written_at_ms,\n        skribs,\n    })''',
                  '''fn calculate_integrity(\n    revision: u64,\n    written_at_ms: u64,\n    skribs: &[SkribNote],\n) -> Result<String, StorageError> {\n    calculate_integrity_for_schema(CURRENT_SCHEMA_VERSION, revision, written_at_ms, skribs)\n}\n\nfn calculate_integrity_for_schema(\n    schema_version: u32,\n    revision: u64,\n    written_at_ms: u64,\n    skribs: &[SkribNote],\n) -> Result<String, StorageError> {\n    let bytes = serde_json::to_vec(&IntegrityPayload {\n        schema_version,\n        revision,\n        written_at_ms,\n        skribs,\n    })''',
              ),
              (
                  '''        if schema_version != u64::from(CURRENT_SCHEMA_VERSION) {\n            return Err(StorageError::UnsupportedSchema {\n                path: file_name_for_display(path),\n                version: schema_version,\n            });\n        }\n\n        let stored: StoredSkribsV2 =\n            serde_json::from_value(value).map_err(|error| StorageError::InvalidData {\n                path: file_name_for_display(path),\n                reason: format!("invalid schema-v2 envelope: {error}"),\n            })?;\n        let expected = calculate_integrity(stored.revision, stored.written_at_ms, &stored.skribs)?;\n        if stored.integrity != expected {\n            return Err(StorageError::InvalidData {\n                path: file_name_for_display(path),\n                reason: "integrity digest mismatch".to_string(),\n            });\n        }\n\n        return Ok(DecodedCandidate {\n            source,\n            path: path.to_path_buf(),\n            revision: stored.revision,\n            written_at_ms: stored.written_at_ms,\n            skribs: stored.skribs,\n            migrated_from_schema: None,\n        });''',
                  '''        if schema_version != u64::from(CURRENT_SCHEMA_VERSION)\n            && schema_version != u64::from(PREVIOUS_SCHEMA_VERSION)\n        {\n            return Err(StorageError::UnsupportedSchema {\n                path: file_name_for_display(path),\n                version: schema_version,\n            });\n        }\n\n        let stored: StoredSkribsV2 =\n            serde_json::from_value(value).map_err(|error| StorageError::InvalidData {\n                path: file_name_for_display(path),\n                reason: format!("invalid schema-v{} envelope: {error}", schema_version),\n            })?;\n        let expected = calculate_integrity_for_schema(\n            stored.schema_version,\n            stored.revision,\n            stored.written_at_ms,\n            &stored.skribs,\n        )?;\n        if stored.integrity != expected {\n            return Err(StorageError::InvalidData {\n                path: file_name_for_display(path),\n                reason: "integrity digest mismatch".to_string(),\n            });\n        }\n\n        return Ok(DecodedCandidate {\n            source,\n            path: path.to_path_buf(),\n            revision: stored.revision,\n            written_at_ms: stored.written_at_ms,\n            skribs: stored.skribs,\n            migrated_from_schema: (stored.schema_version != CURRENT_SCHEMA_VERSION)\n                .then_some(stored.schema_version),\n        });''',
              ),
          ]

          for old, new in replacements:
              count = storage.count(old)
              if count != 1:
                  raise SystemExit(f'storage.rs: expected one source pattern, found {count}')
              storage = storage.replace(old, new)

          storage_path.write_text(storage, encoding='utf-8')

          rust_literal_files = [
              'apps/desktop/src-tauri/src/core/coordinator.rs',
              'apps/desktop/src-tauri/src/core/models.rs',
              'apps/desktop/src-tauri/src/core/storage.rs',
              'apps/desktop/src-tauri/src/desktop/library.rs',
              'apps/desktop/src-tauri/src/lib.rs',
              'apps/desktop/src-tauri/src/note_lifecycle.rs',
              'apps/desktop/src-tauri/src/bin/storage_acceptance.rs',
          ]

          total_inserted = 0
          for file_name in rust_literal_files:
              file = Path(file_name)
              lines = file.read_text(encoding='utf-8').splitlines(keepends=True)
              output = []
              for index, line in enumerate(lines):
                  output.append(line)
                  if 'updated_at:' not in line:
                      continue
                  next_lines = ''.join(lines[index + 1:index + 4])
                  if 'deleted_at:' in next_lines:
                      continue
                  indent = line[: len(line) - len(line.lstrip())]
                  output.append(f'{indent}deleted_at: None,\n')
                  total_inserted += 1
              file.write_text(''.join(output), encoding='utf-8')

          if total_inserted < 10:
              raise SystemExit(f'expected at least ten SkribNote literal updates, found {total_inserted}')

      - name: Remove one-run workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-trash-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src
          git diff --cached --check
          git commit -m 'feat(storage): migrate note lifecycle data to schema v3'
          git push origin HEAD:feat/131-reversible-trash
