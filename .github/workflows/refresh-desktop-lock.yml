name: Desktop Source Alignment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align-desktop-source:
    if: github.head_ref == 'fix/compact-note-window'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: fix/compact-note-window
          fetch-depth: 0

      - name: Reopen an existing application note
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/desktop/src-tauri/src/lib.rs')
          source = path.read_text(encoding='utf-8')

          if 'let existing_notes = coordinator_hk.get_skribs_for_target(target);' not in source:
              pattern = r'''\s*let timestamp = std::time::SystemTime::now\(\)[\s\S]*?if let Err\(message\) = persist_skribs\(&state_hk\) \{\s*let _ = app_handle_hk.emit\("skribly://storage-error", message\);\s*\}'''
              replacement = '''
                                  let existing_notes = coordinator_hk.get_skribs_for_target(target);
                                  if existing_notes.is_empty() {
                                      let timestamp = std::time::SystemTime::now()
                                          .duration_since(std::time::UNIX_EPOCH)
                                          .unwrap_or_default()
                                          .as_millis();
                                      let new_note = SkribNote {
                                          id: format!("skrib-hotkey-{}", timestamp),
                                          target_process_name: target.process_name.clone(),
                                          target_title: target.title.clone(),
                                          rel_x: 0.0,
                                          rel_y: 0.0,
                                          width: 400.0,
                                          height: 340.0,
                                          text: String::new(),
                                          color: "yellow".into(),
                                          collapsed: false,
                                          created_at: (timestamp / 1000) as u64,
                                          updated_at: (timestamp / 1000) as u64,
                                      };
                                      coordinator_hk.upsert_skrib(new_note);
                                      if let Err(message) = persist_skribs(&state_hk) {
                                          let _ = app_handle_hk.emit("skribly://storage-error", message);
                                      }
                                  }'''
              source, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise SystemExit('Could not update the shortcut note flow')

          path.write_text(source, encoding='utf-8')

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and refresh lockfile
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit aligned desktop source
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/src/lib.rs apps/desktop/src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs apps/desktop/src-tauri/Cargo.lock
          git commit -m "align compact note behaviour"
          git push origin HEAD:fix/compact-note-window
