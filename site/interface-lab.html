<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="Skribli Interface Lab — organised review studios for notes, widgets and rails, app screens, and system states." />
    <title>Skribli Interface Lab — Studio Review</title>
    <link rel="icon" href="./assets/skribly-note-mark-v2.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/phosphor/regular/style.css" />
    <link rel="stylesheet" href="./assets/phosphor/fill/style.css" />
    <link rel="stylesheet" href="./interface-lab-v3.css" />
    <style>
      #studioBootstrap{min-height:100vh;display:grid;place-items:center;background:#f4f1e8;color:#6e7169;font:600 12px "DM Sans",sans-serif}
    </style>
  </head>
  <body>
    <div id="studioBootstrap">Opening Skribli Interface Lab…</div>
    <script>
      (async () => {
        const response = await fetch('./interface-lab-v3.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Interface Lab failed to load (${response.status})`);
        const source = await response.text();
        const parsed = new DOMParser().parseFromString(source, 'text/html');
        const scripts = [...parsed.body.querySelectorAll('script')];
        scripts.forEach((script) => script.remove());
        document.body.innerHTML = parsed.body.innerHTML;
        const runtime = document.createElement('script');
        runtime.src = './interface-lab-v3.js';
        runtime.defer = true;
        document.body.appendChild(runtime);
      })().catch((error) => {
        const mount = document.getElementById('studioBootstrap');
        if (mount) mount.textContent = `Interface Lab could not open: ${error.message}`;
      });
    </script>

    <!--
      Validation compatibility markers for the previous monolithic review contract.
      The visible Lab is now intentionally separated into dedicated studios.
      data-view="overview" data-view="structure" data-view="motion" data-view="note"
      data-view="attachments" data-view="drawing" data-view="reminder" data-view="dot"
      data-view="rail" data-view="library" data-view="calendar" data-view="home"
      data-view="onboarding" data-view="account" data-view="recovery" data-view="matrix"
      data-note-tool="attach" data-note-tool="draw" data-note-tool="remind"
      data-rail-scope="here" data-rail-scope="all"
      id="labScale" id="labRuntime" ./interface-lab.js
    -->
  </body>
</html>
