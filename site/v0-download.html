<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#fffdf7" />
    <title>Download Skribli v0</title>
    <link rel="icon" href="./assets/skribly-note-mark-v2.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./ux-polish.css" />
    <link rel="stylesheet" href="./landing-typography.css" />
    <script src="./v0-download.js" defer></script>
  </head>
  <body>
    <main class="legal-page">
      <section class="legal-shell owner-download-shell" aria-labelledby="owner-download-title">
        <img src="./assets/skribly-note-mark-v2.svg" alt="" width="72" height="72" />
        <p class="overline">SKRIBLI V0</p>
        <h1 id="owner-download-title">Enter your download key.</h1>
        <p class="legal-intro">
          The installer is encrypted. The key is checked locally in this browser and is never sent
          to Skribli, Vercel, GitHub, or any account provider.
        </p>

        <form class="owner-download-form" data-v0-key-form novalidate>
          <label>
            <span>Download key</span>
            <input name="downloadKey" type="password" autocomplete="off" minlength="24" required />
          </label>
          <button class="button button-dark" type="submit" data-v0-key-submit>
            Decrypt and download v0
          </button>
          <p class="owner-download-status" data-v0-key-status role="status" aria-live="polite">
            Enter the key exactly as provided.
          </p>
        </form>

        <nav class="legal-nav" aria-label="Download links">
          <a class="button button-light" href="/">Back to Skribli</a>
          <a class="button button-light" href="/release-notes">Read development notes</a>
        </nav>
      </section>
    </main>
  </body>
</html>
